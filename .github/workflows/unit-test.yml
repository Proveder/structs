name: Unit Test
run-name: ${{ github.actor }} is unit-testing 🚀
# Never runs on push or pull request: the Release workflow calls it on the
# commit it is about to tag, and it can be run by hand from the Actions tab.
on:
  workflow_dispatch:
  workflow_call:
jobs:
  Unit-Test:
    runs-on: ubuntu-latest
    steps:
        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: '1.26.5'
            check-latest: true

        - name: Check out repository code
          uses: actions/checkout@v4

        # Tests + crap4go gate in ONE test run: `make crap` runs the unit tests
        # (CRAP_TEST_CMD) for coverage, then fails on any function above
        # CRAP_THRESHOLD; the report also lands in the job's step summary.
        - name: Run tests + CRAP gate
          run: make crap
