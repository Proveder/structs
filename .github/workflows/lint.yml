name: Lint
run-name: ${{ github.actor }} is linting 🔍
on: [push]
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: '1.24.4'
            check-latest: true

        - name: Check out repository code
          uses: actions/checkout@v4

        # Pinned rather than @latest so a new analyzer in an upstream release
        # cannot turn CI red on an unrelated commit. Bump deliberately.
        #
        # Both tools declare go >= 1.25 while this module stays on go 1.24.4, so
        # the install relies on Go's automatic toolchain switching to fetch a
        # newer toolchain just for building them. GOTOOLCHAIN is set explicitly
        # in case a runner image ever defaults it to "local". This does not
        # change the Go version the module is built or vetted with - that still
        # comes from the go directive in go.mod.
        - name: Install lint tools
          env:
            GOTOOLCHAIN: auto
          run: |
            go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
            go install golang.org/x/tools/gopls@v0.21.1

        - name: Run lint
          run: make lint
