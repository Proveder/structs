name: Lint
run-name: ${{ github.actor }} is linting 🔍
# Never runs on push or pull request: the Release workflow calls it on the
# commit it is about to tag, and it can be run by hand from the Actions tab.
on:
  workflow_dispatch:
  workflow_call:
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: '1.26.5'
            check-latest: true

        - name: Check out repository code
          uses: actions/checkout@v4

        # Pinned rather than @latest so a new analyzer in an upstream release
        # cannot turn CI red on an unrelated commit. Bump deliberately.
        - name: Install lint tools
          run: |
            go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
            go install golang.org/x/tools/gopls@v0.21.1

        - name: Run lint
          run: make lint
