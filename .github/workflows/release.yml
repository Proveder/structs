name: Release
run-name: ${{ github.actor }} is releasing a ${{ inputs.bump }} version

# Tags a new version of this library. Run it by hand: Actions tab → Release →
# Run workflow, or `gh workflow run release.yml -f bump=minor`.
#
# Every check below runs on the commit being released (the same workflows can
# also be run by hand); the tag is created only when all of them pass. Nothing
# runs on pushes or pull requests.
#
# The tag is annotated and made by github-actions[bot]; a tag pushed with the
# workflow token does not start other workflows.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

# One release at a time: a second run waits, then numbers itself after the
# first one's tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      previous: ${{ steps.next.outputs.previous }}
      next: ${{ steps.next.outputs.next }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every tag, to find the latest version

      - name: Work out the next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases are cut from $DEFAULT_BRANCH; this run is on $GITHUB_REF_NAME."
            exit 1
          fi
          released="$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          if [ -n "$released" ]; then
            echo "::error::This commit is already released as $released."
            exit 1
          fi
          previous="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          IFS=. read -r major minor patch <<< "${previous:-v0.0.0}"
          major="${major#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unknown bump '$BUMP'."; exit 1 ;;
          esac
          next="v$major.$minor.$patch"
          # From v2 on, Go needs the major version at the end of the module path.
          module="$(awk '$1 == "module" { print $2; exit }' go.mod)"
          if [ "$major" -ge 2 ] && [ "${module##*/}" != "v$major" ]; then
            echo "::error::$next needs the module path to end in /v$major; go.mod says $module."
            exit 1
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "### $next: $BUMP after ${previous:-no earlier version}" >> "$GITHUB_STEP_SUMMARY"

  lint:
    needs: version
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  unit-test:
    needs: version
    uses: ./.github/workflows/unit-test.yml
    secrets: inherit

  tag:
    name: Tag ${{ needs.version.outputs.next }}
    needs: [version, lint, unit-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Create and push the tag
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" "$GITHUB_SHA" -m "$NEXT" \
            -m "Released by $GITHUB_ACTOR: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin "refs/tags/$NEXT"
          module="$(awk '$1 == "module" { print $2; exit }' go.mod)"
          {
            echo "Tagged **$NEXT** on \`${GITHUB_SHA::7}\`."
            echo
            echo '```'
            echo "go get $module@$NEXT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
